# =============================================================
# 圈圈语音社 — Nginx 生产配置
# 用法：将本文件放到 /etc/nginx/nginx.conf（覆盖默认），
#       或作为 server 片段 include 到 http {} 块中。
# 需替换：YOUR_DOMAIN、CERT_PATH、KEY_PATH、PROJECT_ROOT
# =============================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # ---------- Gzip 压缩 ----------
    gzip  on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/xml+rss application/atom+xml image/svg+xml
        application/wasm;

    # ---------- 上传大小限制（与后端 MAX_UPLOAD_BYTES=20MB 一致）----------
    client_max_body_size 25m;

    # ---------- 上游后端 ----------
    upstream circle_backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    # ---------- HTTP → HTTPS 跳转 ----------
    server {
        listen 80;
        server_name YOUR_DOMAIN;
        return 301 https://$host$request_uri;
    }

    # ---------- HTTPS 主站 ----------
    server {
        listen 443 ssl http2;
        server_name YOUR_DOMAIN;

        # SSL 证书（替换为你的证书路径）
        ssl_certificate     CERT_PATH/fullchain.pem;
        ssl_certificate_key KEY_PATH/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # 根目录：前端文件夹（如前后端同服部署，上传 frontend-netlify 到此）
        # 如前端部署在 Netlify，可删除以下 root/index/static 相关配置，仅保留 /api 和 /ws 代理
        root  PROJECT_ROOT/frontend-netlify;
        index index.html;

        # 自定义 404 页面
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        # ---------- 安全响应头 ----------
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ---------- 上传文件（由 Nginx 直接提供，带缓存）----------
        location /uploads/ {
            alias  PROJECT_ROOT/frontend/uploads/;
            expires 7d;
            add_header Cache-Control "public";
            access_log off;
        }

        # ---------- 静态资源（强缓存）----------
        location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|bmp|mp4|webm|mov|m4v|mp3|m4a|wav|aac|woff|woff2|ttf|eot|wasm)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        # ---------- API 接口反向代理 ----------
        location /api/ {
            proxy_pass http://circle_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_buffering on;
        }

        # ---------- WebSocket ----------
        location /ws {
            proxy_pass http://circle_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---------- 管理后台 /admin ----------
        # 后端会返回 admin.html，直接代理即可
        location = /admin {
            proxy_pass http://circle_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------- 其他路径：交给后端处理（含 SPA 路由回退）----------
        location / {
            proxy_pass http://circle_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }
    }
}
