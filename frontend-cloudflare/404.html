<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面未找到 — 圈圈语音社</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0d0b1a 0%, #1a1033 50%, #0d0b1a 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    overflow: hidden;
  }
  .bg-glow {
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(139,92,246,0.15) 0%, transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .container {
    text-align: center;
    padding: 40px 24px;
    position: relative;
    z-index: 1;
  }
  .error-code {
    font-size: clamp(120px, 30vw, 220px);
    font-weight: 800;
    line-height: 1;
    background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 50%, #f59e0b 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -8px;
    filter: drop-shadow(0 0 40px rgba(139,92,246,0.3));
  }
  .error-title {
    font-size: 28px;
    font-weight: 700;
    margin-top: 8px;
    margin-bottom: 12px;
  }
  .error-desc {
    font-size: 16px;
    color: rgba(255,255,255,0.6);
    max-width: 420px;
    margin: 0 auto 36px;
    line-height: 1.6;
  }
  .btn-group {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 28px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s ease;
    border: none;
    cursor: pointer;
  }
  .btn-primary {
    background: linear-gradient(135deg, #8b5cf6, #ec4899);
    color: #fff;
    box-shadow: 0 4px 20px rgba(139,92,246,0.35);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 28px rgba(139,92,246,0.5);
  }
  .btn-ghost {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .btn-ghost:hover {
    background: rgba(255,255,255,0.14);
  }
  .floating {
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  .icon { font-size: 48px; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="container floating">
  <div class="icon">🧭</div>
  <div class="error-code">404</div>
  <h1 class="error-title">走丢了？</h1>
  <p class="error-desc">你访问的页面不存在或已被移除。<br>检查一下网址是否正确，或者回到首页继续探索。</p>
  <div class="btn-group">
    <a href="/" class="btn btn-primary"><i class="fa-solid fa-house"></i> 回到首页</a>
    <a href="/admin" class="btn btn-ghost"><i class="fa-solid fa-shield-halved"></i> 管理后台</a>
  </div>
</div>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</body>
</html>
